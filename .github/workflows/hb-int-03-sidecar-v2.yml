name: HB-INT-03 strict sidecar v2 (unqualified)
on:
  pull_request:
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/**'
      - '.github/workflows/hb-int-03-sidecar-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          dotnet-quality: preview
      - name: Real SDK, restore, regression and companion build
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet --info
          run_logged() {
            local name="$1"; shift
            set +e
            "$@" 2>&1 | tee "$RUNNER_TEMP/$name.log"
            local rc="$?"
            set -e
            sha256sum "$RUNNER_TEMP/$name.log"
            echo "$name exit=$rc"
            return "$rc"
          }
          run_logged restore dotnet restore Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HardwareBridge.SelfTests.csproj
          run_logged selftests dotnet run --no-restore --project Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HardwareBridge.SelfTests.csproj -c Release
          run_logged companion dotnet build --no-restore Compilers/HybridCPU_Compiler/HardwareBridge/HardwareBridge.Companion.csproj -c Release
