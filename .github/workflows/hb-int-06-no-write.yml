name: HB-INT-06 pinned Core import QA (unqualified software contracts)
on:
  pull_request:
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/**'
      - '.github/workflows/hb-int-06-no-write.yml'
  push:
    branches: [master]
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/**'
      - '.github/workflows/hb-int-06-no-write.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-only:
    name: Windows .NET 11 Bridge + mutation + pinned Golden no-write
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact Bridge commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: bridge
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Checkout pinned Golden (read-only source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuriyyak23/HybridCPU-v2
          ref: 6946ccab9d888f7dae0a4d8e18480f436138acd9
          path: golden
          persist-credentials: false
          submodules: false
          lfs: false
      - name: No-secret Core gate negative tests (synthetic repo only)
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HbInt06.CoreGate.ps1') -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Bridge contract tests, source audit and bounded mutation tests
        shell: pwsh
        env:
          HB_BRIDGE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/Run-HbInt06.ps1'
          $arguments = @{
            BridgeRoot = (Join-Path $env:GITHUB_WORKSPACE 'bridge')
            ExpectedBridgeSha = $env:HB_BRIDGE_SHA
            GoldenRoot = (Join-Path $env:GITHUB_WORKSPACE 'golden')
            ExpectedGoldenSha = '6946ccab9d888f7dae0a4d8e18480f436138acd9'
            ExpectedSdkVersion = '11.0.100-rc.2.26504.105'
            OutputRoot = (Join-Path $env:RUNNER_TEMP 'hb-int-06-standalone')
          }
          & $script @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Bridge-only raw receipts for existing standalone diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hb-int-06-standalone-raw
          path: '${{ runner.temp }}/hb-int-06-standalone'
          if-no-files-found: warn
          retention-days: 3

  paired-core-contract:
    # The private Core credential is NEVER injected into pull_request jobs.
    # PR check intentionally fails Blocked; run on trusted master push/dispatch
    # after owner configures a read-only single-repository Core credential.
    name: Pinned Core importer contract host (NOT source qualification)
    runs-on: windows-2025
    timeout-minutes: 45
    # Keep this job visible and non-green for PR/absent secret; no implicit skip-as-pass.
    permissions:
      contents: read
    steps:
      - name: Checkout Bridge from immutable event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: bridge
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
          submodules: false
          lfs: false
      - name: No-secret pin and event preflight; fail Blocked, never skip green
        id: core_preflight
        shell: pwsh
        env:
          HB_BRIDGE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
          # No credential is even evaluated on PR runs.
          HB_CORE_READ_TOKEN: "${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.ref_protected && github.repository == 'yuriyyak23/HybridCPU-Compilers') && secrets.HB_INT_06_CORE_READ_TOKEN || '' }}"
        run: |
          $gate = Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HbInt06.CoreGate.ps1'
          & $gate -Mode Preflight -ExpectedBridgeSha $env:HB_BRIDGE_SHA -ExpectedCoreSha 'b5c44685197a40df99a4d48891120b12475c6ca5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout private Core at exact pinned commit with read-only credential
        # Only the checkout action may receive a token; PR never reaches this step.
        # continue-on-error exposes the checkout outcome to the mandatory failing gate.
        if: steps.core_preflight.outcome == 'success'
        id: core_checkout
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuriyyak23/CircuitWeave
          ref: b5c44685197a40df99a4d48891120b12475c6ca5
          token: "${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.ref_protected && github.repository == 'yuriyyak23/HybridCPU-Compilers') && secrets.HB_INT_06_CORE_READ_TOKEN || '' }}"
          path: core
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify private checkout, full history, exact SHA and published Core test project
        shell: pwsh
        env:
          HB_CORE_CHECKOUT_OUTCOME: '${{ steps.core_checkout.outcome }}'
        run: |
          $gate = Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HbInt06.CoreGate.ps1'
          & $gate -Mode Checkout -CheckoutOutcome $env:HB_CORE_CHECKOUT_OUTCOME -CoreRoot (Join-Path $env:GITHUB_WORKSPACE 'core') -ExpectedCoreSha 'b5c44685197a40df99a4d48891120b12475c6ca5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout independent pinned Golden source (no compiler/build in checkout)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: yuriyyak23/HybridCPU-v2
          ref: 6946ccab9d888f7dae0a4d8e18480f436138acd9
          path: golden
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install exact .NET 11 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Execute Bridge v1/v2/Companion and actual pinned Core CW-INT-03 reader contract
        id: paired_validator
        shell: pwsh
        env:
          HB_BRIDGE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/Run-HbInt06.ps1'
          $arguments = @{
            BridgeRoot = (Join-Path $env:GITHUB_WORKSPACE 'bridge')
            ExpectedBridgeSha = $env:HB_BRIDGE_SHA
            GoldenRoot = (Join-Path $env:GITHUB_WORKSPACE 'golden')
            ExpectedGoldenSha = '6946ccab9d888f7dae0a4d8e18480f436138acd9'
            CoreRoot = (Join-Path $env:GITHUB_WORKSPACE 'core')
            ExpectedCoreSha = 'b5c44685197a40df99a4d48891120b12475c6ca5'
            CoreImporterProject = 'tests/CircuitWeave.CWINT03.BridgeImport/CircuitWeave.CWINT03.BridgeImport.csproj'
            ExpectedSdkVersion = '11.0.100-rc.2.26504.105'
            OutputRoot = (Join-Path $env:RUNNER_TEMP 'hb-int-06-paired')
            RequirePaired = $true
          }
          # Deliberately NOT CoreOnly: execute both sets; a failed Companion is not masked.
          # Parent owns compiler results and source inventory. Never override its failure.
          & $script @arguments
          $runExit = $LASTEXITCODE
          $gate = Join-Path $env:GITHUB_WORKSPACE 'bridge/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HbInt06.CoreGate.ps1'
          & $gate -Mode Downstream -ExpectedCoreSha 'b5c44685197a40df99a4d48891120b12475c6ca5' -DownstreamExitCode $runExit -PairedReceiptPath (Join-Path $env:RUNNER_TEMP 'hb-int-06-paired/hb-int-06-qa-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Emit allowlisted no-source/no-secret paired QA summary
        if: always()
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'hb-int-06-paired-summary'
          New-Item -Path $dest -ItemType Directory -Force | Out-Null
          $receipt = Join-Path $env:RUNNER_TEMP 'hb-int-06-paired/hb-int-06-qa-receipt.json'
          if (Test-Path -LiteralPath $receipt -PathType Leaf) {
            $r = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
            $commands = @($r.Commands | ForEach-Object {
              [ordered]@{
                Name = $_.Name; Status = $_.Status; ExitCode = $_.ExitCode
                ExecutableSha256 = $_.ExecutableSha256
                StdoutSha256 = $_.StdoutSha256; StderrSha256 = $_.StderrSha256
              }
            })
            $safe = [ordered]@{
              Schema = 'hb-int-06-ci-public-summary/v1'
              Scope = 'Unqualified software-only contract tests; NOT Golden/RTL qualification'
              BridgeHead = $r.BridgeHead; CoreHead = $r.CoreHead; GoldenHead = $r.GoldenHead
              SdkVersion = $r.ExpectedSdkVersion
              # The public summary is NOT a qualification receipt.
              GateStatus = 'See hb-r0-02-core-gate-receipts artifact'
              CoreImporter = $r.Matrix.StrictCoreImporter
              PairedValidatorOutcome = '${{ steps.paired_validator.outcome }}'
              GoldenBeforeTreeSha256 = $r.GoldenBefore.TreeSha256
              GoldenAfterTreeSha256 = $r.GoldenAfter.TreeSha256
              GoldenSourceUnchanged = $r.SourceUnchanged
              CoreBeforeTreeSha256 = $r.CoreBefore.TreeSha256
              CoreAfterTreeSha256 = $r.CoreAfter.TreeSha256
              CoreSourceUnchanged = $r.CoreSourceUnchanged
              Matrix = $r.Matrix; Commands = $commands
            }
          } else {
            $safe = [ordered]@{
              Schema = 'hb-int-06-ci-public-summary/v1'; Status = 'Blocked'
              CorePin = 'b5c44685197a40df99a4d48891120b12475c6ca5'
              Reason = 'No paired receipt: credential/event, checkout or SDK step blocked; see job conclusions'
              Commands = @()
              CoreImporter = 'NotRun'
              PairedValidatorOutcome = '${{ steps.paired_validator.outcome }}'
            }
          }
          $file = Join-Path $dest 'summary.json'
          $safe | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $file -Encoding utf8NoBOM
          Write-Host "Allowlisted summary SHA256=$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash)"
      - name: Upload ONLY allowlisted paired summary (never Core checkout or raw logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hb-int-06-paired-summary-no-source
          path: '${{ runner.temp }}/hb-int-06-paired-summary/summary.json'
          if-no-files-found: error
          retention-days: 3

      - name: Publish only sanitized R0-02 gate receipts (no private data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hb-r0-02-core-gate-receipts
          path: '${{ runner.temp }}/hb-r0-02-core-gate/*.json'
          if-no-files-found: warn
          retention-days: 3
