name: R3-02 sealed v2 workspace tests (unqualified)
on:
  pull_request:
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/SourceSnapshot/BridgeV2OwnedWorkspacePublisher.cs'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/BridgeV2OwnedWorkspaceTests.cs'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HardwareBridge.V2.ContractTests.csproj'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/BridgeIndexV2TestHost.cs'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Docs/HB_INT_V2_Owned_Workspace_Publishing.md'
      - '.github/workflows/hb-int-v2-workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-v2-real-disk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
      - name: Exact SDK, actual compile and filesystem regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          export TMPDIR="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TEMP="$RUNNER_TEMP"
          inventory() {
            (cd "$GITHUB_WORKSPACE" && git ls-files -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          }
          checkout_head="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "checkout_head_sha=$checkout_head"
          test "$checkout_head" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" diff --exit-code
          before="$(inventory)"
          echo "tracked_sha_inventory_before=$before"
          finalize() {
            local result="$?"
            trap - EXIT
            local after
            after="$(inventory)"
            echo "tracked_sha_inventory_after=$after"
            test "$before" = "$after" || result=1
            git -C "$GITHUB_WORKSPACE" diff --exit-code || result=1
            echo "checkout_head_sha_after=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$checkout_head" || result=1
            # Never blindly remove an unknown descendant, even on failure.
            if find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'hb-int-v2-*' | grep -q .; then
              echo 'ERROR: R3-02 owned TEMP outputs remain' >&2
              result=1
            fi
            exit "$result"
          }
          trap finalize EXIT
          mkdir -p "$RUNNER_TEMP/hb-v2-sdk"
          cd "$RUNNER_TEMP/hb-v2-sdk"
          # Never write global.json or build outputs under the Golden source tree.
          printf '%s\n' '{"sdk":{"version":"11.0.100-rc.2.26504.105","rollForward":"disable","allowPrerelease":true}}' > global.json
          dotnet --info
          sha256sum "$(command -v dotnet)"
          test "$(dotnet --version)" = '11.0.100-rc.2.26504.105'
          project="$GITHUB_WORKSPACE/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HardwareBridge.V2.ContractTests.csproj"
          output="$RUNNER_TEMP/hb-v2-artifacts"
          logged() {
            local name="$1"; shift
            local start="$SECONDS"
            set +e
            "$@" > "$RUNNER_TEMP/$name.stdout" 2> "$RUNNER_TEMP/$name.stderr"
            local rc="$?"
            set -e
            sha256sum "$RUNNER_TEMP/$name.stdout" "$RUNNER_TEMP/$name.stderr"
            echo "$name exit=$rc duration_seconds=$((SECONDS-start))"
            if [ "$rc" -ne 0 ]; then
              tail -n 60 "$RUNNER_TEMP/$name.stderr"
              tail -n 30 "$RUNNER_TEMP/$name.stdout"
            else
              grep '^PASS:' "$RUNNER_TEMP/$name.stdout" || true
            fi
            return "$rc"
          }
          logged restore dotnet restore "$project" -p:ArtifactsPath="$output"
          logged build dotnet build "$project" --no-restore -c Release -p:ArtifactsPath="$output"
          logged contract dotnet run --project "$project" --no-build --no-restore -c Release -p:ArtifactsPath="$output"
          echo 'Compiled source-only test binaries:'
          find "$output" -type f \( -name '*ContractTests*.dll' -o -name '*ContractTests*.pdb' \) -exec sha256sum {} \;

