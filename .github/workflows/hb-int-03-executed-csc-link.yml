name: HB-INT-03 actual isolated Csc PE-PDB method linkage
on:
  pull_request:
    branches: [master]
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/CompilerFacts/BridgeExecutedCscLinkV1.cs'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscLinkFixture/**'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Docs/HB_INT_03_Executed_Csc_Link.md'
      - '.github/workflows/hb-int-03-executed-csc-link.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-csc-fixture:
    name: pinned SDK actual Csc -> PE/PDB -> metadata/PDB mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'
          dotnet-quality: preview
      - name: Execute pinned actual Csc fixture in isolated runner temp
        shell: bash
        run: |
          set -Eeuo pipefail
          sdk='11.0.100-rc.2.26504.105'
          work="$RUNNER_TEMP/hb-int-03-csc-link"
          mkdir -p "$work/obj" "$work/bin"
          printf '%s\n' '{"sdk":{"version":"11.0.100-rc.2.26504.105","rollForward":"disable","allowPrerelease":true}}' > "$work/global.json"
          cd "$work"
          echo "actual SDK=$(dotnet --version) available SDKs:"
          dotnet --list-sdks
          test "$(dotnet --version)" = "$sdk"
          csc="$DOTNET_ROOT/sdk/$sdk/Roslyn/bincore/csc.dll"
          echo "actual CSC executable image SHA256:"
          test -f "$csc"
          sha256sum "$csc"
          git -C "$GITHUB_WORKSPACE" ls-files -z | LC_ALL=C sort -z | (
            cd "$GITHUB_WORKSPACE"
            xargs -0 sha256sum
          ) > "$RUNNER_TEMP/hb-int-03-before-files.sha256"
          sha256sum "$RUNNER_TEMP/hb-int-03-before-files.sha256"
          export HB_CSC_PATH="$csc"
          export HB_SDK_VERSION="$sdk"
          echo "SDK=$sdk RUN_SHA=$GITHUB_SHA"
          dotnet --info
          project="$GITHUB_WORKSPACE/Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscLinkFixture/HardwareBridge.CscLink.FixtureTests.csproj"
          set +e
          dotnet restore "$project" -p:ArtifactsPath="$work" 2>&1 | tee "$work/restore.log"
          restore_exit=${PIPESTATUS[0]}
          set -e
          sha256sum "$work/restore.log"
          echo "restore-exit=$restore_exit"
          test "$restore_exit" -eq 0
          set +e
          dotnet build "$project" -c Release --no-restore -p:ArtifactsPath="$work" 2>&1 | tee "$work/build.log"
          build_exit=${PIPESTATUS[0]}
          set -e
          sha256sum "$work/build.log"
          echo "build-exit=$build_exit"
          test "$build_exit" -eq 0
          set +e
          dotnet "$work/bin/HardwareBridge.CscLink.FixtureTests/HardwareBridge.CscLink.FixtureTests.dll" 2>&1 | tee "$work/fixture.log"
          fixture_exit=${PIPESTATUS[0]}
          set -e
          sha256sum "$work/fixture.log"
          echo "fixture-exit=$fixture_exit"
          test "$fixture_exit" -eq 0
      - name: R1-03 production prerequisites remain fail-closed
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          
          path = (Path(os.environ["GITHUB_WORKSPACE"]) /
              "Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscLinkFixture/"
              "R1_03_ProductionEvidenceContract.json")
          data = path.read_bytes()
          if not 0 < len(data) <= 16384:
              raise SystemExit("R1_03_CONTRACT_BOUNDS: invalid receipt prerequisite byte count")
          def unique(pairs):
              value = {}
              for key, entry in pairs:
                  if key in value:
                      raise ValueError("R1_03_CONTRACT_DUPLICATE: " + key)
                  value[key] = entry
              return value
          contract = json.loads(data, object_pairs_hook=unique)
          expected = {"R1-01", "R1-02", "R0-01", "CW-INT-04"}
          roles = contract.get("RequiredExternalReceipts")
          if (contract.get("Schema") !=
                  "hybridcpu.hardwarebridge.r1-03-production-prerequisites/v1"
                  or contract.get("SdkPin") != "11.0.100-rc.2.26504.105"
                  or contract.get("Disposition") != "Blocked"
                  or contract.get("PositiveGolden") != "NotRun"
                  or contract.get("PairedCore") != "NotRun"
                  or contract.get("Rtl") != "NotRun"
                  or contract.get("SyntheticReceiptMaySatisfy") is not False
                  or not isinstance(roles, list) or len(roles) != 4
                  or {row.get("Owner") for row in roles} != expected
                  or any(row.get("Status") not in ("Blocked", "NotRun") for row in roles)
                  or any(not row.get("Schema") or not row.get("Evidence") for row in roles)):
              raise SystemExit("R1_03_CONTRACT_PROMOTION: missing or promoted production gate")
          domains = contract.get("IndependentDigestDomains", [])
          if len(domains) != 7 or len(set(domains)) != 7:
              raise SystemExit("R1_03_CONTRACT_DIGESTS: provenance identity domains conflated")
          if contract.get("RejectPromotionStatuses") != [
                  "Verified", "AcceptedRTL", "HardwareQualified"]:
              raise SystemExit("R1_03_CONTRACT_PROMOTION: hardware authority claimed")
          print("Toy: executed Csc fixture separately tested; no Golden provenance")
          print("Golden: Blocked/NotRun — missing qualified external receipts")
          print("Paired Core: NotRun; RTL: NotRun")
          PY
      - name: Confirm Golden and tracked source no-write
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git ls-files -z | LC_ALL=C sort -z | xargs -0 sha256sum \
            > "$RUNNER_TEMP/hb-int-03-after-files.sha256"
          cmp "$RUNNER_TEMP/hb-int-03-before-files.sha256" \
            "$RUNNER_TEMP/hb-int-03-after-files.sha256"
          echo "before and after tracked full-file inventories match:"
          sha256sum "$RUNNER_TEMP/hb-int-03-before-files.sha256" \
            "$RUNNER_TEMP/hb-int-03-after-files.sha256"
          test -z "$(git status --porcelain --untracked-files=normal)"
          echo 'PASS: tracked checkout unchanged (fixture writes only runner TEMP)'
          echo 'BLOCKED: real Golden executed Csc event, Companion facts, Core reader'
          echo 'NOTRUN: RTL and physical qualification'