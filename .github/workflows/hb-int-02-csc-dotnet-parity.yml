name: HB-INT-02 cross-runtime v2 producer byte parity (unqualified)
on:
  pull_request:
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscCoreV2Parity/**'
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/SourceSnapshot/BridgeSegmentIndexV2.cs'
      - '.github/workflows/hb-int-02-csc-dotnet-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prod-codec:
    name: Windows .NET 11 actual Bridge codec vs PR14 Python producer
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Pin SDK outside source and execute actual positive/mutation parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $temp = (& python -c 'import tempfile; print(tempfile.gettempdir())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $temp) { throw 'Python TEMP missing' }
          $output = Join-Path $temp ('hb02-parity-' + [Guid]::NewGuid().ToString('N'))
          $sdk = Join-Path $temp ('hb02-sdk-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $sdk | Out-Null
          [IO.File]::WriteAllText((Join-Path $sdk 'global.json'),
            '{"sdk":{"version":"11.0.100-rc.2.26504.105","rollForward":"disable","allowPrerelease":true}}',
            [Text.UTF8Encoding]::new($false))
          $env:DOTNET_CLI_HOME = Join-Path $sdk 'home'
          $env:NUGET_PACKAGES = Join-Path $sdk 'packages'
          $env:DOTNET_NOLOGO = '1'
          $project = Join-Path $env:GITHUB_WORKSPACE 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscCoreV2Parity/HardwareBridge.CscCoreV2Parity.csproj'
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscCoreV2Parity/emit_fixture.py'
          $artifactPath = Join-Path $sdk 'artifacts'
          try {
            & python $fixture $output
            if ($LASTEXITCODE -ne 0) { throw "Synthetic PR14 producer fixture failed: exit=$LASTEXITCODE" }
            Push-Location $sdk
            try {
              $version = (& dotnet --version).Trim()
              if ($LASTEXITCODE -ne 0 -or $version -cne '11.0.100-rc.2.26504.105') {
                throw "Wrong SDK: $version"
              }
              $args = @('run','--project',$project,'--configuration','Release',
                "-p:ArtifactsPath=$artifactPath",'--',$output)
              $goodLog = Join-Path $sdk 'positive.txt'
              & dotnet @args > $goodLog 2>&1
              $goodExit = $LASTEXITCODE
              Write-Host "Actual positive command exit=$goodExit stdout/stderr SHA256=$((Get-FileHash $goodLog -Algorithm SHA256).Hash)"
              if ($goodExit -ne 0) {
                Get-Content -LiteralPath $goodLog
                throw 'Real .NET serializer parity failed'
              }
              Get-Content -LiteralPath $goodLog
              $testArgv = @('run','--no-build','--no-restore','--project',$project,
                '--configuration','Release',"-p:ArtifactsPath=$artifactPath",'--',$output)
              function Assert-Refused([string] $Label) {
                $log = Join-Path $sdk ("negative-" + $Label + ".txt")
                & dotnet @testArgv > $log 2>&1
                $code = $LASTEXITCODE
                Write-Host "Negative $Label actual exit=$code stdout/stderr SHA256=$((Get-FileHash $log -Algorithm SHA256).Hash)"
                if ($code -eq 0) { throw "Mutation was admitted: $Label" }
              }
              $source = Join-Path $output 'src/00002.cs'
              $original = [IO.File]::ReadAllBytes($source)
              [IO.File]::WriteAllBytes($source, [byte[]]@(1,2,3))
              Assert-Refused 'changed-source'
              [IO.File]::WriteAllBytes($source, $original)
              $indexPath = Join-Path $output 'index.json'
              $index = [IO.File]::ReadAllBytes($indexPath)
              [IO.File]::AppendAllText($indexPath, ' ')
              Assert-Refused 'stale-index'
              [IO.File]::WriteAllBytes($indexPath, $index)
              $crossPath = Join-Path $output 'capture-crosswalk.json'
              $cross = [IO.File]::ReadAllText($crossPath)
              [IO.File]::WriteAllText($crossPath,
                $cross.Replace('"Kind":"reference"', '"Kind":"csc-source"'), [Text.UTF8Encoding]::new($false))
              Assert-Refused 'promoted-metadata'
              $compiled = Get-ChildItem -LiteralPath $artifactPath -Recurse -File |
                Where-Object { $_.Name -match 'CscCoreV2Parity.*\.(dll|pdb)$' }
              if (-not $compiled) { throw 'No actual compiled test binary to attest' }
              foreach ($file in $compiled) {
                Write-Host "Compiled binary $($file.FullName) SHA256=$((Get-FileHash $file.FullName -Algorithm SHA256).Hash)"
              }
            } finally { Pop-Location }
          } finally {
            if (Test-Path -LiteralPath $output) { Remove-Item -LiteralPath $output -Recurse -Force }
          }
          # Three negative executable runs intentionally returned 1. Explicitly
          # mark only the harness as successful after all assertions and hashes.
          exit 0
# Does not qualify Golden execution, current Roslyn source body, RTL/EDA/target.

  r203-release-stager-binary-parity:
    name: R2-03 production .NET DLL vs Python release stager (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Compile production codec with exact SDK in OS TEMP and execute release parity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $temp = (& python -c 'import tempfile; print(tempfile.gettempdir())').Trim()
          if ($LASTEXITCODE -ne 0 -or -not $temp) { throw 'OS TEMP unavailable' }
          $work = Join-Path $temp ('hb-r203-' + [Guid]::NewGuid().ToString('N'))
          New-Item -Path $work -ItemType Directory | Out-Null
          $project = Join-Path $env:GITHUB_WORKSPACE 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscCoreV2Parity/HardwareBridge.CscCoreV2Parity.csproj'
          $driver = Join-Path $env:GITHUB_WORKSPACE 'Compilers/HybridCPU_Compiler/HardwareBridge/Tests/CscCoreV2Parity/r203_release_wire_driver.py'
          $obj = Join-Path $work 'obj'
          $bin = Join-Path $work 'bin'
          $logs = Join-Path $work 'logs'
          New-Item -Path $logs -ItemType Directory | Out-Null
          [IO.File]::WriteAllText((Join-Path $work 'global.json'),
            '{"sdk":{"version":"11.0.100-rc.2.26504.105","rollForward":"disable","allowPrerelease":true}}',
            [Text.UTF8Encoding]::new($false))
          $env:DOTNET_CLI_HOME = Join-Path $work 'home'
          $env:NUGET_PACKAGES = Join-Path $work 'packages'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT = '1'
          $env:DOTNET_NOLOGO = '1'
          $beforeSha = (& git rev-parse HEAD).Trim()
          $before = (& git status --porcelain=v1 --untracked-files=all) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $before) { throw 'Checkout must start clean' }
          Push-Location $work
          try {
            $version = (& dotnet --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -cne '11.0.100-rc.2.26504.105') {
              throw "Expected pinned SDK, received $version"
            }
            $props = @("-p:BaseIntermediateOutputPath=$obj/", "-p:MSBuildProjectExtensionsPath=$obj/", "-p:OutputPath=$bin/")
            $restoreLog = Join-Path $logs 'restore.txt'
            & dotnet restore $project @props > $restoreLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "dotnet restore SDK=$version exit=$rc stdout/stderr SHA=$((Get-FileHash $restoreLog -Algorithm SHA256).Hash)"
            if ($rc -ne 0) { Get-Content $restoreLog; throw 'Production codec restore failed' }
            $buildLog = Join-Path $logs 'build.txt'
            & dotnet build $project --configuration Release --no-restore @props > $buildLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "dotnet build SDK=$version exit=$rc stdout/stderr SHA=$((Get-FileHash $buildLog -Algorithm SHA256).Hash)"
            if ($rc -ne 0) { Get-Content $buildLog; throw 'Production codec build failed' }
            $dll = Join-Path $bin 'HardwareBridge.CscCoreV2Parity.dll'
            if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw 'Actual compiled production-codec host DLL missing'
            }
            Write-Host "Compiled test host DLL SHA=$((Get-FileHash $dll -Algorithm SHA256).Hash)"
            $pdb = Join-Path $bin 'HardwareBridge.CscCoreV2Parity.pdb'
            if (-not (Test-Path -LiteralPath $pdb -PathType Leaf)) {
              throw 'Actual compiled test host PDB missing'
            }
            Write-Host "Compiled synthetic host PDB SHA=$((Get-FileHash $pdb -Algorithm SHA256).Hash)"
            $dotnetHost = (Get-Command dotnet).Source
            Write-Host "Actual dotnet host SHA=$((Get-FileHash $dotnetHost -Algorithm SHA256).Hash)"
            $sdkLine = & dotnet --list-sdks | Where-Object { $_.StartsWith("$version [") } | Select-Object -First 1
            if (-not $sdkLine) { throw 'Pinned SDK location not found' }
            $sdkParent = [regex]::Match($sdkLine, '\[(.*)\]
            & dotnet $dll --wire-limits > $limitsLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "dotnet --wire-limits exit=$rc stdout/stderr SHA=$((Get-FileHash $limitsLog -Algorithm SHA256).Hash)"
            if ($rc -ne 0) { Get-Content $limitsLog; throw 'Production codec high-water limits failed' }
            $parityLog = Join-Path $logs 'release-parity.txt'
            & python $driver $dll > $parityLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "Python release-stager + compiled DLL parity exit=$rc stdout/stderr SHA=$((Get-FileHash $parityLog -Algorithm SHA256).Hash)"
            Get-Content -LiteralPath $parityLog -Tail 110
            if ($rc -ne 0) { throw 'Cross-language binary fixture/negative matrix failed' }
            Write-Host 'R2-03 fixture-only PASS. Real Golden Csc and Core-owned reader: NotRun.'
          } finally {
            Pop-Location
            $afterSha = (& git rev-parse HEAD).Trim()
            $after = (& git status --porcelain=v1 --untracked-files=all) -join [Environment]::NewLine
            Write-Host "Checkout HEAD before=$beforeSha after=$afterSha; porcelain beforeLength=$($before.Length) afterLength=$($after.Length)"
            if ($beforeSha -ne $afterSha -or $after -ne $before) {
              throw 'R2-03 violated immutable Git checkout'
            }
            if (Test-Path -LiteralPath $work) {
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }
          exit 0

# R2-03 synthetic transport-only checks; no Golden source or Core consumer access.
).Groups[1].Value
            if (-not $sdkParent) { throw 'Pinned SDK location malformed' }
            $roslyn = Join-Path (Join-Path $sdkParent $version) 'Roslyn/bincore/csc.dll'
            if (-not (Test-Path -LiteralPath $roslyn -PathType Leaf)) {
              throw 'Actual pinned Roslyn compiler image missing'
            }
            Write-Host "Pinned SDK Roslyn/csc.dll SHA=$((Get-FileHash $roslyn -Algorithm SHA256).Hash)"
            $limitsLog = Join-Path $logs 'limits.txt'
            & dotnet $dll --wire-limits > $limitsLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "dotnet --wire-limits exit=$rc stdout/stderr SHA=$((Get-FileHash $limitsLog -Algorithm SHA256).Hash)"
            if ($rc -ne 0) { Get-Content $limitsLog; throw 'Production codec high-water limits failed' }
            $parityLog = Join-Path $logs 'release-parity.txt'
            & python $driver $dll > $parityLog 2>&1
            $rc = $LASTEXITCODE
            Write-Host "Python release-stager + compiled DLL parity exit=$rc stdout/stderr SHA=$((Get-FileHash $parityLog -Algorithm SHA256).Hash)"
            Get-Content -LiteralPath $parityLog -Tail 110
            if ($rc -ne 0) { throw 'Cross-language binary fixture/negative matrix failed' }
            Write-Host 'R2-03 fixture-only PASS. Real Golden Csc and Core-owned reader: NotRun.'
          } finally {
            Pop-Location
            $afterSha = (& git rev-parse HEAD).Trim()
            $after = (& git status --porcelain=v1 --untracked-files=all) -join [Environment]::NewLine
            Write-Host "Checkout HEAD before=$beforeSha after=$afterSha; porcelain beforeLength=$($before.Length) afterLength=$($after.Length)"
            if ($beforeSha -ne $afterSha -or $after -ne $before) {
              throw 'R2-03 violated immutable Git checkout'
            }
            if (Test-Path -LiteralPath $work) {
              Remove-Item -LiteralPath $work -Recurse -Force
            }
          }
