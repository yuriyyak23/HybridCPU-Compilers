name: HB-INT-04 managed raw-trace contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'Compilers/HybridCPU_Compiler/HardwareBridge/**'
      - '.github/workflows/hb-int-04-managed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-contract:
    name: Managed contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: SDK and revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          dotnet --info
      - name: Run real standalone tests (no native/EDA claim)
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project Compilers/HybridCPU_Compiler/HardwareBridge/Tests/HardwareBridge.SelfTests.csproj -c Release
      - name: Build opt-in companion
        shell: bash
        run: |
          set -euo pipefail
          dotnet build Compilers/HybridCPU_Compiler/HardwareBridge/HardwareBridge.Companion.csproj -c Release
